[package]
name = "rust_clicker"
version = "0.1.0"
edition = "2021"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow"] }
winapi = { version = "0.3.9", features = ["winuser", "timeapi", "mmsystem", "minwindef", "windef", "winnt", "profileapi", "wingdi"] }
rand = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }
